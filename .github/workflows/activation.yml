name: Acquire Unity activation file

# One-time helper to activate a Unity Personal license for CI.
# Run it manually from the Actions tab, then follow .github/CI_SETUP.md.

on:
  workflow_dispatch:
  # Also runs automatically whenever this file changes, so the .alf can be
  # generated without the workflow being present on the default branch.
  push:
    paths:
      - ".github/workflows/activation.yml"

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
